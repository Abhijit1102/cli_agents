[project]
name = "cli-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "openai>=2.32.0",
    "python-dotenv>=1.2.2",
    "Pillow>=10.0.0",
    "rich>=15.0.0",
    "typer>=0.25.0",
    "tavily-python",
    "mimetype>=0.1.5",
    "tzdata>=2026.2",
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
cli_agents = "cli_agents.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_agents*"]
