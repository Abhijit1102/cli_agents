[project]
name = "cli-agents"
version = "1.0.1"
description = "A modular CLI-based AI agent framework for building autonomous, tool-using workflows with MCP integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "httpx>=0.27.1",
    "openai>=2.32.0",
    "python-dotenv>=1.2.2",
    "pillow>=10.0.0",
    "rich>=15.0.0",
    "typer>=0.25.0",
    "mimetype>=0.1.5",
    "tzdata>=2026.2",
    "prompt-toolkit>=3.0.52",
    "mcp>=1.27.0",
    "jedi>=0.20.0",
    "seedir>=0.5.1",
]

[project.scripts]
cli_agents = "cli_agents.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_agents*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
